<style>@keyframes fitaispin{to{transform:rotate(360deg)}}</style>
<script>
/* self-heal boot. A stale Service Worker/cache OR an in-app browser that defers inline scripts
   are the usual causes of an endless loader. We kill stale SW/caches, try one auto-reload, then
   offer a gentle manual retry — never a loop, never a scary message. */
(function(){
  try{
    if('serviceWorker' in navigator){ navigator.serviceWorker.getRegistrations().then(function(rs){ rs.forEach(function(r){ try{r.unregister();}catch(e){} }); }).catch(function(){}); }
    if(window.caches && caches.keys){ caches.keys().then(function(ks){ ks.forEach(function(k){ try{caches.delete(k);}catch(e){} }); }).catch(function(){}); }
  }catch(e){}
  window.__fitaiBooted=false;
  function sub(t){ var el=document.getElementById('fitai-bootsub'); if(el) el.textContent=t; }
  function retryBtn(){
    var el=document.getElementById('fitai-bootsub'); if(!el) return;
    el.innerHTML='<button onclick="location.reload()" style="background:#ff6a2b;color:#fff;border:none;border-radius:14px;padding:11px 22px;font-size:15px;font-weight:700;cursor:pointer">↻ פתח מחדש</button>'
      +'<div style="color:#777;font-size:12px;margin-top:12px;max-width:280px;line-height:1.6">אם זה לא נפתח — פתחו את הקובץ ישירות ב‑Chrome או Safari (לא בתוך אפליקציה אחרת).</div>';
  }
  // first try: one silent auto-reload after 5s (fixes a stale cache)
  setTimeout(function(){
    if(window.__fitaiBooted) return;
    try{
      if(!sessionStorage.getItem('fitai_autoreloaded')){ sessionStorage.setItem('fitai_autoreloaded','1'); location.reload(); return; }
    }catch(e){}
    // already auto-reloaded once and still stuck → offer manual retry, no loop
    retryBtn();
  }, 5000);
  // if we auto-reloaded last time and we're still here after 5s, show retry
  setTimeout(function(){ if(!window.__fitaiBooted){ try{ if(sessionStorage.getItem('fitai_autoreloaded')) retryBtn(); }catch(e){} } }, 5200);
})();
